                              - generic [ref=f48e16]: shield
                              - text: Data Governance v2.0
                            - heading "Privacy & Ethics" [level=1] [ref=f48e17]
                            - paragraph [ref=f48e18]: Trust is the currency of intelligence. At Xylos, we architect our systems with ethical constraints as core primitives.
                          - generic [ref=f48e19]:
                            - generic [ref=f48e20]:
                              - generic [ref=f48e21]: lock
                              - heading "Zero Retention" [level=3] [ref=f48e23]
                              - paragraph [ref=f48e24]: Ephemeral sessions designed to minimize footprint. We store nothing beyond the immediate interaction window, ensuring no training occurs on private inputs.
                            - generic [ref=f48e25]:
                              - generic [ref=f48e26]: visibility
                              - heading "Encryption" [level=3] [ref=f48e28]
                              - paragraph [ref=f48e29]: End-to-end encryption layers protect data in transit and at rest. Your cryptographic keys remain yours, creating a hard-walled digital sanctuary.
                            - generic [ref=f48e30]:
                              - generic [ref=f48e31]: balance
                              - heading "Ethical Models" [level=3] [ref=f48e33]
                              - paragraph [ref=f48e34]: Safety alignment is baked into our weights. Our models are continuously audited against a rigorous ethical charter to prevent bias and harmful generation.
                            - generic [ref=f48e35]:
                              - generic [ref=f48e36]: fact_check
                              - heading "User Sovereignty" [level=3] [ref=f48e38]
                              - paragraph [ref=f48e39]: Full data control via a unified interface. Export, delete, or audit your interaction history at any time with complete transparency.
                          - generic [ref=f48e40]:
                            - generic [ref=f48e41]:
                              - heading "Data Collection" [level=2] [ref=f48e42]
                              - paragraph [ref=f48e43]: Our collection philosophy is rooted in radical minimization. We only capture the essential metadata required for service stability and performance optimization. Xylos AI maintains a strict non-monetization policy; your data is never sold, traded, or shared with third-party advertising networks.
                            - generic [ref=f48e44]:
                              - heading "AI Training" [level=2] [ref=f48e45]
                              - paragraph [ref=f48e46]: The content of your conversations, uploaded documents, and generated assets is never used to train or fine-tune our foundation models. We utilize synthetic datasets and verified public domain sources for development, ensuring that our collective intelligence is built without compromising individual privacy.
                            - generic [ref=f48e47]:
                              - heading "Ethics Commitment" [level=2] [ref=f48e48]
                              - paragraph [ref=f48e49]: Our bias mitigation framework operates through the Aether Intelligence Layer—a proprietary secondary monitoring system that evaluates output for alignment with human values in real-time. We are committed to transparency, publishing regular audit reports on our model's ethical performance and safety metrics.
                          - paragraph [ref=f48e51]: "Last Updated: April 17, 2026 // Xylos Legal Division"
