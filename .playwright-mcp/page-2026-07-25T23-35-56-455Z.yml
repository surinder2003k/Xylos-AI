                                  - generic [ref=f67e204]: expand_more
                                - paragraph [ref=f67e205]: All communication between the user and Xylos AI is encrypted using TLS 1.3 with Perfect Forward Secrecy. We utilize FIPS 140-2 Level 3 certified Hardware Security Modules (HSMs) to manage cryptographic keys, ensuring that even Xylos administrators cannot access user data streams.
