                              - text: Data Governance v2.0
                            - heading "Privacy & Ethics" [level=1] [ref=f57e17]
                            - paragraph [ref=f57e18]: Trust is the currency of intelligence. At Xylos, we architect our systems with ethical constraints as core primitives.
                          - generic [ref=f57e19]:
                            - generic [ref=f57e20]:
                              - generic [ref=f57e21]: lock
                              - heading "Zero Retention" [level=3] [ref=f57e23]
                              - paragraph [ref=f57e24]: Ephemeral sessions designed to minimize footprint. We store nothing beyond the immediate interaction window, ensuring no training occurs on private inputs.
                            - generic [ref=f57e25]:
                              - generic [ref=f57e26]: visibility
                              - heading "Encryption" [level=3] [ref=f57e28]
                              - paragraph [ref=f57e29]: End-to-end encryption layers protect data in transit and at rest. Your cryptographic keys remain yours, creating a hard-walled digital sanctuary.
                            - generic [ref=f57e30]:
                              - generic [ref=f57e31]: balance
                              - heading "Ethical Models" [level=3] [ref=f57e33]
                              - paragraph [ref=f57e34]: Safety alignment is baked into our weights. Our models are continuously audited against a rigorous ethical charter to prevent bias and harmful generation.
                            - generic [ref=f57e35]:
                              - generic [ref=f57e36]: fact_check
                              - heading "User Sovereignty" [level=3] [ref=f57e38]
                              - paragraph [ref=f57e39]: Full data control via a unified interface. Export, delete, or audit your interaction history at any time with complete transparency.
                          - generic [ref=f57e40]:
                            - generic [ref=f57e41]:
                              - heading "Data Collection" [level=2] [ref=f57e42]
                              - paragraph [ref=f57e43]: Our collection philosophy is rooted in radical minimization. We only capture the essential metadata required for service stability and performance optimization. Xylos AI maintains a strict non-monetization policy; your data is never sold, traded, or shared with third-party advertising networks.
                            - generic [ref=f57e44]:
                              - heading "AI Training" [level=2] [ref=f57e45]
                              - paragraph [ref=f57e46]: The content of your conversations, uploaded documents, and generated assets is never used to train or fine-tune our foundation models. We utilize synthetic datasets and verified public domain sources for development, ensuring that our collective intelligence is built without compromising individual privacy.
                            - generic [ref=f57e47]:
                              - heading "Ethics Commitment" [level=2] [ref=f57e48]
                              - paragraph [ref=f57e49]: Our bias mitigation framework operates through the Aether Intelligence Layer—a proprietary secondary monitoring system that evaluates output for alignment with human values in real-time. We are committed to transparency, publishing regular audit reports on our model's ethical performance and safety metrics.
                          - paragraph [ref=f57e51]: "Last Updated: April 17, 2026 // Xylos Legal Division"
