                  - img "Surinder Kumar" [ref=f171e2396]
                  - paragraph [ref=f171e2397]: "THEME 9 - SPLIT-SCREEN NARRATIVE: Design a landing page for \"Xylos AI\" using a SPLIT-SCREEN layout that alternates left/right on each scroll section. The entire page is divided into two vertical halves. LEFT half: always shows a sticky visual (3D model, animation, or illustration) that changes per section. RIGHT half: scrolls through content sections — Section 1: \"Meet Xylos AI\" intro text. Section 2: \"Chat with 7+ Models\" with model list. Section 3: \"Auto-Post Blog\" with workflow diagram. Section 4: \"Code Smarter\" with code snippet preview. Section 5: CTA. Then it FLIPS — left becomes content, right becomes the sticky visual. Background: gradient from deep navy #0a0e1a to dark purple #1a0a2e. Primary: electric indigo #6366f1, secondary: teal #14b8a6, tertiary: coral #f87171. Typography-heavy, editorial feel. Scroll-triggered text reveals and image parallax. Sharp, modern, magazine editorial layout."
