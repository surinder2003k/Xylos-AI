                - paragraph [ref=f171e2426]:
                  - text: I've designed the
                  - strong [ref=f171e2427]: Xylos AI Split-Screen Narrative
                  - text: ", a high-fidelity landing page that breaks traditional scrolling patterns in favor of a cinematic, editorial experience."
                - heading "Design Rationale:" [level=3] [ref=f171e2428]
                - list [ref=f171e2429]:
                  - listitem [ref=f171e2430]:
                    - strong [ref=f171e2431]: Kinetic Split-Screen Architecture
                    - text: ": I've implemented a vertical 50/50 layout that alternates content and visuals as you scroll. This creates a rhythmic pacing that mirrors high-end magazine design, keeping the user engaged through visual contrast."
                  - listitem [ref=f171e2432]:
                    - strong [ref=f171e2433]: Neural Synthesis Core
                    - text: ": The experience is anchored by a persistent, interactive"
                    - strong [ref=f171e2434]: Three.js 3D scene
                    - text: (
                    - code [ref=f171e2435]: "[Animation]"
                    - text: ). This floating neural lattice features pulsing teal logic cores and coral data particles, providing a tangible representation of Xylos AI's "living" intelligence.
                  - listitem [ref=f171e2436]:
                    - strong [ref=f171e2437]: Editorial Typography
                    - text: ": Using a combination of"
                    - strong [ref=f171e2438]: Space Grotesk
                    - text: and
                    - strong [ref=f171e2439]: Geist
                    - text: ", the layout leverages massive, sharp headlines and generous whitespace to establish a technical but sophisticated brand voice."
                  - listitem [ref=f171e2440]:
                    - strong [ref=f171e2441]: Deep Obsidian Palette
                    - text: ": I've established a new design system ("
                    - code [ref=f171e2442]: "[Design_System]"
                    - text: ) grounded in a deep navy (#0a0e1a) to dark purple gradient, allowing the electric indigo and teal accents to pop with high-energy contrast.
                  - listitem [ref=f171e2443]:
                    - strong [ref=f171e2444]: Narrative Flow
                    - text: ": Each section focuses on a singular pillar of the platform—from multi-model orchestration to automated editorial workflows—presented through a mix of sharp code previews and abstract neural illustrations."
