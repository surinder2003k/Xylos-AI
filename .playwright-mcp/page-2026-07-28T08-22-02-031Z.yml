                          - generic [ref=f238e15]: Data Governance v2.0
                          - heading "Privacy & Ethics" [level=1] [ref=f238e16]
                          - paragraph [ref=f238e17]: At Xylos, we treat your data as a sacred artifact. Our infrastructure is built on the principles of radical transparency and cryptographically guaranteed privacy.
                        - generic [ref=f238e18]:
                          - generic [ref=f238e21]:
                            - generic [ref=f238e22]:
                              - generic [ref=f238e23]: history_toggle_off
                              - heading "Zero Retention" [level=3] [ref=f238e24]
                              - paragraph [ref=f238e25]: Session data is vaporized the moment your interaction ends. We store nothing but the mathematical weights necessary for the inference process.
                            - generic [ref=f238e26]: "Protocol: Oblivion-X"
                          - generic [ref=f238e27]:
                            - generic [ref=f238e28]: shield_lock
                            - heading "End-to-End" [level=3] [ref=f238e29]
                            - paragraph [ref=f238e30]: AES-256 encryption at rest and in transit. Your keys, your data.
                          - generic [ref=f238e31]:
                            - generic [ref=f238e32]: fingerprint
                            - heading "Sovereignty" [level=3] [ref=f238e33]
                            - paragraph [ref=f238e34]: Export your full digital history at any time with a single command.
                          - generic [ref=f238e39]:
                            - heading "Ethical Training Framework" [level=3] [ref=f238e40]
                            - paragraph [ref=f238e41]: Our models are trained exclusively on curated datasets with full provenance. We reject "web-scraping" in favor of direct licensing and synthetic data generation that respects intellectual property and human rights. Every parameter is audited for bias mitigation.
                            - generic [ref=f238e42]:
                              - generic [ref=f238e43]: Non-Aggregative
                              - generic [ref=f238e44]: Consent-Driven
                        - generic [ref=f238e45]:
                          - generic [ref=f238e46]:
                            - heading "01. Data Collection" [level=2] [ref=f238e47]
                            - generic [ref=f238e48]:
                              - paragraph [ref=f238e49]: We do not sell your soul. In a world of digital exhaust, Xylos acts as a lead shield. We collect the absolute minimum telemetry required to keep the lights on—primarily infrastructure performance metrics and system health logs.
                              - list [ref=f238e50]:
                                - listitem [ref=f238e51]:
                                  - generic [ref=f238e52]: check_circle
                                  - generic [ref=f238e53]: No IP tracking beyond localized session validation.
                                - listitem [ref=f238e54]:
                                  - generic [ref=f238e55]: check_circle
                                  - generic [ref=f238e56]: No cross-site fingerprinting or advertising identifiers.
                                - listitem [ref=f238e57]:
                                  - generic [ref=f238e58]: check_circle
                                  - generic [ref=f238e59]: No long-term storage of prompt history unless explicitly toggled by the user.
                          - generic [ref=f238e60]:
                            - heading "02. AI Training" [level=2] [ref=f238e61]
                            - paragraph [ref=f238e63]: Training shouldn't be a predatory act. Our reinforcement learning from human feedback (RLHF) processes are conducted with professional reviewers under strict NDAs, never using unpaid or coerced labor. We are pioneering Federated Learning techniques that allow model improvement without data leaving your device.
                          - generic [ref=f238e64]:
                            - heading "03. Moral Governance" [level=2] [ref=f238e65]
                            - paragraph [ref=f238e67]: Our internal Ethics Board has veto power over all product deployments. If a feature compromises user agency or psychological well-being, it is scrapped. No exceptions. We publish our alignment research bi-annually for public scrutiny.
