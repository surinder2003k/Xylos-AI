name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Supabase's public URL/key are inlined into the client bundle at build time,
    # so the build cannot prerender pages without them. They are public values
    # and are safe to stand in for; the tests that need a working backend skip
    # themselves when no real service-role key is present. Server secrets
    # (RESEND_API_KEY, SUPABASE_SERVICE_ROLE_KEY, provider API keys) are
    # deliberately absent, so a build that depends on them fails here.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs the suite against the build produced above, not against production,
      # so a green check always means the committed code works.
      - name: Playwright
        env:
          PLAYWRIGHT_TARGET_LOCAL: "1"
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
